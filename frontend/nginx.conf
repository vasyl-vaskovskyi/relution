# Serves the Angular build and proxies the API on the same origin (ADR-0019).
# Rules: docs/operations/deployment.md#nginx-frontendnginxconf, headers: docs/architecture/security.md#frontend
# This file is included in the http context of the image's nginx.conf.

server_tokens off;

# No $request_uri or $args: search terms travel in the query string and must never be logged
log_format appstore '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time "$http_x_correlation_id"';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    access_log /dev/stdout appstore;

    # Server-level headers are inherited only by locations without their own add_header, so none adds one
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://*.mzstatic.com data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Request headers such as X-Correlation-Id and traceparent pass through unchanged
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location /auth/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # index.html must not be cached, so a new build is picked up; hashed bundles may be
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri /index.html;
    }
}
