# Property names, environment variables and defaults: docs/operations/configuration.md

spring:
  application:
    name: appstore
  threads:
    virtual:
      enabled: true

server:
  port: 8080

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        add-additional-paths: true
  # Level 2 (docs/operations/observability.md): every OTLP export is off; compose.observability.yml turns them on
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: false
    sampling:
      probability: 0.1
  logging:
    export:
      enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        "[appstore.apple.requests]": true

springdoc:
  default-produces-media-type: application/json

logging:
  structured:
    ecs:
      service:
        name: appstore

appstore:
  auth:
    # secret, client.id and client.secret have no defaults: set APPSTORE_AUTH_* or the app refuses to start
    jwt:
      issuer: appstore
      audience: appstore-api
      ttl: PT15M
  apple:
    search:
      url: https://itunes.apple.com
      budget: 20
    lookup:
      url: https://uclient-api.itunes.apple.com
    timeout:
      connect: PT2S
      read: PT5S
    retry:
      max: 2
      timeout: PT8S
    retryafter:
      max: PT5M
    circuit:
      failurerate: 50
      window: 20
      minimumcalls: 10
      open: PT30S
      halfopencalls: 3
  cache:
    search:
      ttl: PT10M
      size: 1000
    details:
      ttl: PT15M
      size: 5000
    notfound:
      ttl: PT60S
