[versions]
spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"
springdoc = "3.1.1"
wiremock-spring-boot = "4.2.3"
archunit = "1.5.0"
resilience4j = "2.4.0"
spotless = "8.10.2"
palantir-java-format = "2.98.0"
# Not managed by Boot; keep it on the release built against Boot's opentelemetry-api (1.62.0 in Boot 4.1.1), ADR-0051
opentelemetry-logback-appender = "2.28.1-alpha"

[libraries]
# Versions managed by the Spring Boot BOM
boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
boot-starter-opentelemetry = { module = "org.springframework.boot:spring-boot-starter-opentelemetry" }
boot-starter-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient" }
boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-security-oauth2-resource-server" }
boot-test-security = { module = "org.springframework.boot:spring-boot-starter-security-test" }
boot-test-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test" }
boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
boot-test-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator-test" }
boot-test-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient-test" }
boot-test-validation = { module = "org.springframework.boot:spring-boot-starter-validation-test" }
boot-test-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine" }
micrometer-context-propagation = { module = "io.micrometer:context-propagation" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# Versions pinned here
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
wiremock-spring-boot = { module = "org.wiremock.integrations:wiremock-spring-boot", version.ref = "wiremock-spring-boot" }
archunit-junit6 = { module = "com.tngtech.archunit:archunit-junit6", version.ref = "archunit" }
resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker", version.ref = "resilience4j" }
resilience4j-micrometer = { module = "io.github.resilience4j:resilience4j-micrometer", version.ref = "resilience4j" }
opentelemetry-logback-appender = { module = "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0", version.ref = "opentelemetry-logback-appender" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
