# Optional observability stack (Level 2): docs/operations/observability.md and deployment.md.
#   cp .env.observability.example .env.observability   # then set the password
#   docker compose --env-file .env.observability -f docker-compose.yml -f compose.observability.yml up --build
# The Grafana password comes from .env.observability, not .env: --env-file only feeds the interpolation below,
# so the app container (env_file: .env) never receives it. This file holds no secrets (ADR-0006).
services:
  app:
    environment:
      # OTLP export over HTTP to the collector in otel-lgtm; variable names: docs/operations/configuration.md
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "true"
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://otel-lgtm:4318/v1/metrics
      MANAGEMENT_TRACING_EXPORT_ENABLED: "true"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://otel-lgtm:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      # also turns on the Logback appender that feeds the exporter (ADR-0051); console logs are unchanged
      MANAGEMENT_LOGGING_EXPORT_ENABLED: "true"
      MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: http://otel-lgtm:4318/v1/logs
    depends_on:
      otel-lgtm:
        condition: service_started

  otel-lgtm:
    # Grafana marks this image as for development, demo and testing only
    image: grafana/otel-lgtm:0.33.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${APPSTORE_GRAFANA_ADMIN_PASSWORD:?set APPSTORE_GRAFANA_ADMIN_PASSWORD in .env.observability and pass --env-file .env.observability}
      # the provisioned "App Store service" dashboard opens as the Grafana home page
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/custom/appstore-service.json
    volumes:
      # committed dashboards (ops/grafana), read-only; the image's own RED and JVM dashboards stay
      - ./ops/grafana/provisioning/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro
      - ./ops/grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/custom:ro
    ports:
      # only Grafana is published; the app reaches the collector on the compose network
      - "127.0.0.1:3000:3000"
