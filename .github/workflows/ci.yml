name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      # Also validates the Gradle wrapper checksum
      - uses: gradle/actions/setup-gradle@v6.3.0
      - run: ./gradlew check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Build only, nothing is pushed
      - run: docker build backend
      - run: docker build frontend

  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # promtool from the Prometheus image pinned in ops/promtool/Dockerfile (ADR-0050)
      - run: docker build -t promtool ops/promtool
      - run: docker run --rm -v "$GITHUB_WORKSPACE/ops:/ops:ro" promtool check rules /ops/alerts.yml
      - run: docker run --rm -v "$GITHUB_WORKSPACE/ops:/ops:ro" promtool test rules /ops/alerts.test.yml
